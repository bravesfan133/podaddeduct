# PodAdDeduct — home-server compose file.
# On the server: cp .env.example .env && docker compose up -d --build
services:
  podaddeduct:
    build: .
    image: podaddeduct:local
    ports:
      - "7887:7887"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 7887
      # Container defaults for Linux transcription (N100-friendly).
      # The home-page Server settings override these at runtime.
      STT_PYTHON: python
      STT_SIDECAR: ./scripts/stt_faster.py
      STT_MODEL: base
    volumes:
      - podaddeduct-data:/data
    restart: unless-stopped

volumes:
  podaddeduct-data:
