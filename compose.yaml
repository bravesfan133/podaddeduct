# PodAdDeduct — home-server compose file.
# On the server: cp .env.example .env && docker compose up -d --build
services:
  podaddeduct:
    build: .
    image: podaddeduct:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8080
      # Linux transcription (N100-friendly). Override in .env if needed.
      STT_PYTHON: python
      STT_SIDECAR: ./scripts/stt_faster.py
      STT_MODEL: base
    volumes:
      - podaddeduct-data:/data
    restart: unless-stopped

volumes:
  podaddeduct-data:
